name: JRA Historical Data Collection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Download source CSVs and build the training database
        shell: bash
        run: |
          mkdir -p output
          set -o pipefail
          python -u scripts/build_dataset.py 2>&1 | tee output/fetch_log.txt

      - name: Publish database and audit even if quality checks fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jra-historical-training-data
          retention-days: 30
          if-no-files-found: warn
          path: |
            output/jra_history.sqlite
            output/train.csv
            output/validation.csv
            output/test.csv
            output/race_audit.csv
            output/source_files.csv
            output/summary.json
            output/fetch_log.txt
